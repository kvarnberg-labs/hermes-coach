apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  HERMES_UID: "10000"
  HERMES_GID: "10000"

  # Model provider — opencode-go (same as homelab)
  # deepseek-v4.1-flash verified live on the opencode-go model catalog (2026-10-18).
  HERMES_INFERENCE_PROVIDER: "opencode-go"
  HERMES_INFERENCE_MODEL: "deepseek-v4.1-flash"
  HERMES_INFERENCE_BASE_URL: "https://opencode.ai/zen/go/v1"
  OPENCODE_GO_BASE_URL: "https://opencode.ai/zen/go/v1"

  # API server — enabled so kubelet health probes work
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"

  # Reduce noise in long-running gateway
  HERMES_BACKGROUND_NOTIFICATIONS: "result"

  # Discord — DM-only bot. Athletes message Hermes directly.
  # No channel or role config needed; access is controlled via
  # DISCORD_ALLOWED_USERS in the sealed secret (one ID per athlete).
  DISCORD_REQUIRE_MENTION: "false"

  # Log level — WARNING surfaces tool errors and coach-brain misses without noise.
  # Change to DEBUG temporarily when diagnosing a specific issue.
  LOG_LEVEL: "WARNING"

  # Self-improvement loop delivery: Joey's DM (user chat id), not the guild
  # #general channel 1508814801869082758 — repo/PR detail must not be visible to
  # athletes (lars, wilma, sencit60 are members of #general).
  SELF_IMPROVE_CHANNEL: "1508816099540602970"
