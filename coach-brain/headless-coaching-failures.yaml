headless_coaching_failures:
  purpose: "Prevent technically successful scheduled jobs from producing misleading coaching reports."
  identity:
    - "A cron session may lack gateway user context even when its origin and delivery are configured."
    - "Resolve the athlete from the job's configured origin.user_id or explicit delivery identity; verify that identity before reading any training data."
    - "Routing metadata is not credential proof. Never infer an athlete ID from a channel, cached result, historical conversation, or another user's directory."
  failure_classes:
    context_identity_missing: "Direct tool calls lack a Discord snowflake; use the configured per-athlete identity and the same identity for every call."
    onboarding_missing_or_mismatch: "Per-user credentials are absent, unnamed, or linked to another athlete; stop and request /start without making training claims."
    delivery_failure: "The report was generated but did not reach the intended destination; inspect delivery separately from credential validity."
    semantic_failure: "The scheduler reports success but the response contains an error, placeholder, empty report, or identity-unavailable message. Treat the report as failed."
    data_provenance_failure: "A response uses values, calculations, account claims, or platform behavior not present in the verified tool results, or uses raw terminal/network workarounds instead of the coaching tools. Treat unsupported values as unverified, not as facts."
    output_corruption: "Any coaching response—not only a scheduled brief—containing glitched or garbled tokens (mixed unprompted language, fused words like 'PlanB', broken punctuation/hash fragments inside numbers, or nonsense inserted into otherwise valid prose) is failed output. GLM-5.3-flash-class models have a known intermittent token-corruption mode."
  procedure:
    - "Validate identity, then fetch profile, wellness, activities, planned events, and sport settings with the resolved identity. Stop immediately when verification fails."
    - "Use the registered coaching tools as the sole source for athlete data; never replace a missing or failed tool result with terminal, curl, urllib, cached, or guessed values."
    - "For derived metrics or platform behavior, show the source fields and label calculations or estimates; if the source fields are absent, say the value is unavailable."
    - "State the actual failure class and next action; do not describe missing data as poor recovery or complete rest."
    - "When overnight fields are absent, say they were unavailable and use dated historical records only as context."
    - "Before sending any coaching response, run a final integrity sweep over the assembled text—not only cron briefs. Read it once as text and fix or regenerate sections with garbled tokens, mixed languages, fused words, or broken numeric values."
    - "If corruption is found after delivery, acknowledge the unreliable text and regenerate from the verified tool results; never defend or infer meaning from a garbled sentence."
  evidence_basis: "Credential isolation and observability principles: authentication, routing, scheduler status, semantic report validity, and textual integrity are independent signals; conflating them can misattribute data or hide failed care."
  safety: "Never fabricate coaching from unverified data. A missing response is safer than a confident response about the wrong athlete, and corrupted text is worse than a delayed clean response."
  source_notes: "Derived from recurring cron identity failures and the coaching skill's headless execution and semantic-success requirements; broadened 2026-09-18 after an interactive Wilma post-workout analysis contained extensive mixed-language and garbled-token corruption even though the underlying tool results were valid."
