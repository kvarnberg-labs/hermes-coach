---
# Recovery Heuristics
# Evidence-based guidelines for assessing and managing athlete recovery.

recovery_heuristics:
  tsb_interpretation:
    description: TSB (Training Stress Balance) = CTL - ATL. Also called "form".
    ranges:
      very_negative:
        value: "< -20"
        meaning: "Overreached or high fatigue. Reduce load immediately."
        action: "Prescribe 1–3 easy days. Monitor HRV and subjective feel."
      negative:
        value: "-20 to < -10"
        meaning: "Accumulated fatigue from a training block. Normal in build phases."
        action: "Appropriate for mid-block. Ensure recovery week is planned."
      neutral:
        value: ">= -10 to <= +5"
        meaning: "Moderate freshness. Good for most training sessions."
        action: "Proceed with planned training."
      positive:
        value: "> +5 to <= +25"
        meaning: "Fresh and rested. Good for quality sessions or racing."
        action: "Ideal for key workouts. Avoid too many consecutive days here (detraining)."
      very_positive:
        value: "> +25"
        meaning: "Very fresh, possibly detrained."
        action: "Likely over-tapered. Resume structured training."

  ramp_rate:
    description: Rate of CTL change per week. Target for sustainable progression.
    safe_range: "+3 to +8 CTL points per week"
    warning: "> +10 per week significantly increases injury and illness risk"
    conservative: "+3 to +5 for masters athletes (50+) or returning from injury"

  hrv_interpretation:
    description: >
      HRV (Heart Rate Variability) reflects autonomic nervous system recovery.
      Higher rMSSD generally indicates better recovery, but trend matters more
      than absolute value. Compare to the athlete's own 30-day baseline.
    guidance:
      well_recovered: "HRV at or above 7-day rolling average"
      mildly_fatigued: "HRV 5–10% below rolling average"
      fatigued: "HRV > 10% below rolling average — reduce intensity"
      very_fatigued: "HRV > 20% below average — easy day or rest only"
    caution: >
      HRV is one signal, not the whole picture. Integrate with sleep quality,
      subjective feel, and recent training load before deciding.

  sleep:
    minimum_for_adaptation: "7 hours for most athletes"
    optimal: "8–9 hours during heavy training blocks"
    impact_of_poor_sleep: >
      < 6 hours significantly impairs glycogen resynthesis, hormone production
      (growth hormone, testosterone), and reaction time.
      Do not schedule high-intensity sessions after consecutive nights of poor sleep.

  subjective_feel:
    scale: "1–10 (1 = exhausted, 10 = excellent)"
    guidance:
      1_to_4: "Rest or easy active recovery only"
      5_to_6: "Moderate training OK; skip intensity"
      7_to_8: "Normal training as planned"
      9_to_10: "Key session or race"
    missing_data: >
      If today's fatigue, soreness, motivation, or sleep report is unavailable,
      do not label the athlete "sufficiently recovered" from TSB or objective
      markers alone. State the missing input and give a conservative conditional
      option; subjective feel overrides model readiness when it becomes available.

  scheduled_brief_gate:
    rules:
      - "For a scheduled/headless brief, missing today's subjective feel or overnight recovery inputs makes readiness indeterminate, even when TSB is neutral or positive."
      - "State the missing inputs and give a conservative conditional option; do not label the athlete recovered or prescribe progression from older records alone."
      - "Use TSB, HRV, sleep, resting HR, and recent load as context—not a substitute for subjective feel; update the decision when the athlete reports how they feel."
      - "When required current inputs are missing, describe only the objective trend (for example, lower ATL or improving HRV); do not call the recovery picture solid/good, say the athlete is ready/recovered, or imply readiness through an unqualified progression recommendation."
      - "Do not convert a favorable objective trend into a global recovery verdict (for example, 'good recovery continues'); report the trend and keep readiness conditional until current inputs are available."
      - "For an athlete inside a documented return after a layoff or injury (a detraining_layoff_rebuild or injury_return_to_training return), give the day's ceiling in the unit the return is gated on: an HR ceiling taken from the athlete's own sport settings, with the power band described as the value the athlete grows into. A power band on its own is not a ceiling."
      - "If HR and power disagree during a return, the HR ceiling wins: an elevated HR at the prescribed wattage is a reason to hold or lower power, never a reason to keep the power because the band allows it."
      - "Attribute an elevated submaximal HR to a named cause (detraining, heat, sleep loss, illness) and say which return gate is in use; never hand the athlete an unexplained HR number to 'watch' as if it were a training signal."
      - "Advance a return or rebuild only from the last session the athlete actually completed, read from recent activities, never from the calendar's next entry: an unlogged planned step produced no training stimulus, so stepping up from the plan can exceed the 10% weekly ceiling in detraining_layoff_rebuild.dosing."
      - "If the days since the last prescription contain no logged session, hold the progression and repeat the last completed duration or load, saying that the step was held because it was not executed; do not offer the next step 'if the week has been clean' when the record shows the week was not."
      - "A return gate is passed only when the athlete confirmed it since the last completed session; silence is not a pass, so the next step stays conditional on that confirmation plus the executed record."
      - "Before closing a brief, report the coverage of the next seven days from get_planned_events: name the date the plan ends, and call an empty window a planning gap with its date range - never a rest day, a deload or evidence that the athlete is recovered, because a rest day is a dated decision and a blank day is a missing one."
      - "A plan whose last entry is today is a lapsed plan, not a finished block, unless the block's goal date has passed; say so rather than letting the calendar stand in as the plan."
      - "When the forward window is empty, offer the restart session from the last completed activity - that duration and load at the same ceiling - and ask once for approval to write the next days; do not end the brief on the missing plan."
      - "Before deriving any band from the athlete's settings, check the anchor those settings rest on against the executed record: when the configured threshold pace or FTP is more than about 5% away from what the athlete has actually sustained for roughly an hour - threshold pace against her fastest sustained run, FTP against eFTP or a best effort - print both numbers with their source, prescribe from the executed value until a field test or a completed threshold session reconciles them, and never call the configured value 'your threshold' on its own."
      - "Name every heart-rate or pace band with the zone it actually sits in from the athlete's own get_sport_settings zones: a band may be called recovery, easy or aerobic only when its upper bound is at or below the Aerobic ceiling, which is the second entry of hr_zones, indexed against hr_zone_names; a band that reaches the next boundary up is Tempo and must be named Tempo, because the athlete's own model defines the effort and not the adjective."
      - "When the last completed session ran above the ceiling it was given - in duration, distance or HR - name that breach in the next brief and weekly plan and keep the next attempt at or below the ceiling that was breached instead of advancing the cap; a cap that was broken once is still the cap that governs the next attempt."
      - "Do not read a change in today's CTL, ATL or TSB as work the athlete has done: intervals.icu applies a planned session's load to the day's wellness before that session is ridden, so check recent activities for a completed session on the date and, when the load comes from the calendar, call it the load projected for today's planned session - a session that was never executed becomes evidence in the next assessment and in the return gate that reads it."
      - "power_zones and pace_zones are threshold-relative percentages, not the units the athlete trains in: each entry is that zone's upper bound as a percentage of FTP or of threshold speed and the last entry is an open-ended 999, so convert before quoting a boundary - at FTP 265 the 55 and 75 entries are 146 and 199 W - and the session's own watt cap is not the ceiling of the zone the session sits in."
    rebuild_dosing_evidence: "HR at a fixed submaximal load is the first marker to move after inactivity and the last to normalise (Coyle et al. 1984; Mujika & Padilla 2000), so a pre-layoff wattage is not a safe ceiling for early return sessions; see detraining_layoff_rebuild.dosing."
    progression_evidence: "Progressive overload is applied to completed work (Ronnestad et al. 2012 on session completion and load progression), so a skipped step leaves the athlete at the last achieved duration; the 2026-10-23 Millberg brief stepped from a completed 62 min (2026-10-19) to 75 min, a 21% jump above the documented 10% weekly ceiling, after three unlogged days."
    evidence_basis: "Autonomic and sleep markers are context-sensitive and should be interpreted with subjective effort and symptoms rather than as standalone readiness tests (Halson, 2014; Buchheit, 2014)."
    coverage_evidence: "A planning window with no forward entries is a planning state, not a training state: on 2026-10-25 all three audited athletes had nothing planned after that day (Millberg's plan held one rest NOTE for 2026-10-25 and nothing through 2026-11-02; Joey's held no entry at all in eight days; Wilma's the same apart from today's rest note) and the 06:31 Millberg brief reported a rest day and stopped, because the corpus had no rule about the forward window and planned events are a brief's only plan input."
    zone_band_evidence: "An intensity descriptor is a claim about the athlete's own zone model, so it has to be derived from it: on 2026-10-26 Wilma's brief offered a normal aerobic session at HR 170-180 while her settings run Recovery to 161, Aerobic to 170 and Tempo to 180 with LTHR 191, so the band it called aerobic was Tempo, offered two days after a long run that averaged 175 against a 160 ceiling; the same athlete's 2026-10-25 weekly plan re-issued 65-70 min and about 12 km for a long run whose 60 min / 9 km cap had been broken four days earlier at 68.2 min, 12.01 km and avg HR 175. Bands named against the athlete's own boundaries and a cap held after a breach are the difference between an easy day and a threshold day mislabelled as one (Seiler 2010 on intensity distribution; Esteve-Lanao et al. 2007 on the cost of easy days run too hard)."
    threshold_anchor_evidence: "A configured threshold is a modelled parameter while the executed record is a measurement, and when they disagree the measured one governs the prescription: on 2026-10-28 Wilma's settings carried threshold_pace_mps 3.4482758 (4:50/km) while her fastest run of the last 30 days was 12.01 km in 68.2 min (5:41/km) at avg HR 175, 91.6% of LTHR 191 - a pace 17% faster than she has ever held for an hour, and the same settings file labels that 5:41 effort Zone 2 on pace while HR places it in Tempo; the morning brief then repeated 4:50 as her threshold with no source. Threshold is the ~60 min maximal steady state (Allen and Coggan, Training and Racing with a Power Meter; Daniels' T pace), so a modelled value has to be validated by a sustained effort before bands are derived from it."
    load_provenance_evidence: "A wellness record stops being a measurement once a session is on the calendar: on 2026-10-31 Millberg's today record carried ctl_load 58, exactly event 148926436's planned_load, with projected_ctl 24.19 and projected_atl 15.09 against wellness ctl 24.2 and atl 15.1, while his last completed ride was 2026-10-29 and 2026-10-30 carried ctl_load 0.0 - and the 06:31 brief still reported ATL rising 8.5 to 15.1 after Friday's Zwift work, inventing a session on a rest day and feeding it to the assessment that gates his knee return."
    zone_units_evidence: "The zone arrays are stored in the threshold's units, not the athlete's: the two Millberg briefs of 2026-10-31 placed the same 145-170 W band in an Endurance zone of 135-199 W at 06:31 and in an Endurance zone with ceiling 180 W at 07:31, while power_zones 55/75/90/105/120/150/999 against FTP 265 put Endurance at 146-199 W and 180 W is only the event's own cap - two bound sets for one band in one morning, neither of them the array's."

  consecutive_hard_days:
    max_before_recovery: 2
    note: >
      Stacking 3+ high-intensity days without an easy day significantly increases
      injury risk and reduces quality of subsequent sessions.
      The second hard day is almost always lower quality than the first.

  recovery_week_frequency:
    general: "Every 3rd or 4th week"
    masters_50_plus: "Every 2nd or 3rd week"
    volume_reduction: "30–40% reduction from peak week"
    intensity: "Reduce intensity AND volume during recovery weeks"

# Fatigue Management
fatigue_management:
  overtraining_syndrome_warning_signs:
    signs:
      - "Performance decline despite maintained or increased training"
      - "Persistent HRV suppression > 2 weeks"
      - "Elevated resting HR > 5 bpm above normal"
      - "Mood disturbances: irritability, depression, lack of motivation"
      - "Sleep disturbances despite fatigue"
      - "Increased illness frequency"
      - "Muscle soreness that does not resolve with rest"
    action: >
      If 3+ signs present: recommend 1–2 weeks complete rest, followed by
      gradual return. Consider referral to sports medicine physician if
      symptoms persist beyond 2 weeks of rest.

  non_functional_overreaching:
    description: >
      Performance decline that takes weeks to months to recover from.
      Distinct from functional overreaching (days to 1 week recovery).
    prevention:
      - "Never increase weekly load > 10% from previous week"
      - "Enforce recovery weeks every 3–4 weeks"
      - "Monitor TSB — do not sustain TSB < -20 for more than 2 weeks"
      - "Treat illness and injury as mandatory rest"
