---
# Recovery Heuristics
# Evidence-based guidelines for assessing and managing athlete recovery.

recovery_heuristics:
  tsb_interpretation:
    description: TSB (Training Stress Balance) = CTL - ATL. Also called "form".
    ranges:
      very_negative:
        value: "< -20"
        meaning: "Overreached or high fatigue. Reduce load immediately."
        action: "Prescribe 1–3 easy days. Monitor HRV and subjective feel."
      negative:
        value: "-20 to < -10"
        meaning: "Accumulated fatigue from a training block. Normal in build phases."
        action: "Appropriate for mid-block. Ensure recovery week is planned."
      neutral:
        value: ">= -10 to <= +5"
        meaning: "Moderate freshness. Good for most training sessions."
        action: "Proceed with planned training."
      positive:
        value: "> +5 to <= +25"
        meaning: "Fresh and rested. Good for quality sessions or racing."
        action: "Ideal for key workouts. Avoid too many consecutive days here (detraining)."
      very_positive:
        value: "> +25"
        meaning: "Very fresh, possibly detrained."
        action: "Likely over-tapered. Resume structured training."

  ramp_rate:
    description: Rate of CTL change per week. Target for sustainable progression.
    safe_range: "+3 to +8 CTL points per week"
    warning: "> +10 per week significantly increases injury and illness risk"
    conservative: "+3 to +5 for masters athletes (50+) or returning from injury"

  hrv_interpretation:
    description: >
      HRV (Heart Rate Variability) reflects autonomic nervous system recovery.
      Higher rMSSD generally indicates better recovery, but trend matters more
      than absolute value. Compare to the athlete's own 30-day baseline.
    guidance:
      well_recovered: "HRV at or above 7-day rolling average"
      mildly_fatigued: "HRV 5–10% below rolling average"
      fatigued: "HRV > 10% below rolling average — reduce intensity"
      very_fatigued: "HRV > 20% below average — easy day or rest only"
    caution: >
      HRV is one signal, not the whole picture. Integrate with sleep quality,
      subjective feel, and recent training load before deciding.

  sleep:
    minimum_for_adaptation: "7 hours for most athletes"
    optimal: "8–9 hours during heavy training blocks"
    impact_of_poor_sleep: >
      < 6 hours significantly impairs glycogen resynthesis, hormone production
      (growth hormone, testosterone), and reaction time.
      Do not schedule high-intensity sessions after consecutive nights of poor sleep.

  subjective_feel:
    scale: "1–10 (1 = exhausted, 10 = excellent)"
    guidance:
      1_to_4: "Rest or easy active recovery only"
      5_to_6: "Moderate training OK; skip intensity"
      7_to_8: "Normal training as planned"
      9_to_10: "Key session or race"
    missing_data: >
      If today's fatigue, soreness, motivation, or sleep report is unavailable,
      do not label the athlete "sufficiently recovered" from TSB or objective
      markers alone. State the missing input and give a conservative conditional
      option; subjective feel overrides model readiness when it becomes available.

  scheduled_brief_gate:
    rules:
      - "For a scheduled/headless brief, missing today's subjective feel or overnight recovery inputs makes readiness indeterminate, even when TSB is neutral or positive."
      - "State the missing inputs and give a conservative conditional option; do not label the athlete recovered or prescribe progression from older records alone."
      - "Use TSB, HRV, sleep, resting HR, and recent load as context—not a substitute for subjective feel; update the decision when the athlete reports how they feel."
      - "When required current inputs are missing, describe only the objective trend (for example, lower ATL or improving HRV); do not call the recovery picture solid/good, say the athlete is ready/recovered, or imply readiness through an unqualified progression recommendation."
      - "Do not convert a favorable objective trend into a global recovery verdict (for example, 'good recovery continues'); report the trend and keep readiness conditional until current inputs are available."
      - "For an athlete inside a documented return after a layoff or injury (a detraining_layoff_rebuild or injury_return_to_training return), give the day's ceiling in the unit the return is gated on: an HR ceiling taken from the athlete's own sport settings, with the power band described as the value the athlete grows into. A power band on its own is not a ceiling."
      - "If HR and power disagree during a return, the HR ceiling wins: an elevated HR at the prescribed wattage is a reason to hold or lower power, never a reason to keep the power because the band allows it."
      - "Attribute an elevated submaximal HR to a named cause (detraining, heat, sleep loss, illness) and say which return gate is in use; never hand the athlete an unexplained HR number to 'watch' as if it were a training signal."
      - "Advance a return or rebuild only from the last session the athlete actually completed, read from recent activities, never from the calendar's next entry: an unlogged planned step produced no training stimulus, so stepping up from the plan can exceed the 10% weekly ceiling in detraining_layoff_rebuild.dosing."
      - "If the days since the last prescription contain no logged session, hold the progression and repeat the last completed duration or load, saying that the step was held because it was not executed; do not offer the next step 'if the week has been clean' when the record shows the week was not."
      - "A return gate is passed only when the athlete confirmed it since the last completed session; silence is not a pass, so the next step stays conditional on that confirmation plus the executed record."
      - "Before closing a brief, report the coverage of the next seven days from get_planned_events: name the date the plan ends, and call an empty window a planning gap with its date range - never a rest day, a deload or evidence that the athlete is recovered, because a rest day is a dated decision and a blank day is a missing one."
      - "A plan whose last entry is today is a lapsed plan, not a finished block, unless the block's goal date has passed; say so rather than letting the calendar stand in as the plan."
      - "When the forward window is empty, offer the restart session from the last completed activity - that duration and load at the same ceiling - and ask once for approval to write the next days; do not end the brief on the missing plan."
      - "Before deriving any band from the athlete's settings, check the anchor those settings rest on against the executed record: when the configured threshold pace or FTP is more than about 5% away from what the athlete has actually sustained for roughly an hour - threshold pace against her fastest sustained run, FTP against eFTP or a best effort - print both numbers with their source, prescribe from the executed value until a field test or a completed threshold session reconciles them, and never call the configured value 'your threshold' on its own. The same test governs LTHR and every bpm band derived from it: an LTHR that no sustained effort supports is a model, not a measurement, so compare it with the highest heart rate the athlete has actually held for about 20 to 30 minutes, print both values with the date of the effort behind each, and cap the band at the measured one - a band derived as a percentage of an unvalidated LTHR can land above every heart rate the athlete has ever produced, and an athlete who reports an honest maximal effort without reaching the target is telling you the anchor is wrong, not that the effort was short."
      - "Name every heart-rate or pace band with the zone it actually sits in from the athlete's own get_sport_settings zones: a band may be called recovery, easy or aerobic only when its upper bound is at or below the Aerobic ceiling, which is the second entry of hr_zones, indexed against hr_zone_names; a band that reaches the next boundary up is Tempo and must be named Tempo, because the athlete's own model defines the effort and not the adjective."
      - "When the last completed session ran above the ceiling it was given - in duration, distance, power or HR - name that breach in the next brief and weekly plan and keep the next attempt at or below the ceiling that was breached instead of advancing the cap; a cap that was broken once is still the cap that governs the next attempt. Read a ride's power from normalized_power against the FTP the brief prescribes from, never from the platform's intensity_factor, because IF is computed against the activity's own ftp_used: a 2026-11-04 ride carries IF 70, which reads as Endurance against the configured 265 W, while its 186 W normalized is 77 % of the 240 W eFTP the same brief prescribes from - Tempo, above the 75 % endurance ceiling at 180 W and 26 W above the 160 W it was planned at - so recompute the percentage before naming the zone, and never call such a session a good Zone 2 ride or offer it as a repeat under an HR cap it already exceeded."
      - "Do not read a CTL, ATL or TSB movement as work the athlete has done, and reconcile every date in the wellness window rather than only today: intervals.icu books a planned session's load against the day's wellness before that session is ridden, and a day that was never ridden can keep that load after the date has passed, so compare each date's ctl_load with the training load of the activities logged on that date. A day whose ctl_load has no matching activity is ambiguous rather than untrained: the load can be a booking or a session that has not synced yet, and an early-morning brief runs before the previous day's upload, so when the newest activity in the window is older than the day you are describing, or the day's ctl_load matches a planned event's planned_load instead of any logged session's load, say that day's session has not synced yet and bound every load and trend claim to the dates that carry a logged activity; only a day that precedes the newest synced activity and whose load matches no booking may be called not trained and projected, instead of reporting the trend as training the athlete did."
      - "power_zones and pace_zones are threshold-relative percentages, not the units the athlete trains in: each entry is that zone's upper bound as a percentage of FTP or of threshold speed and the last entry is an open-ended 999, so convert before quoting a boundary - at FTP 265 the 55 and 75 entries are 146 and 199 W - and the session's own watt cap is not the ceiling of the zone the session sits in."
      - "Emit exactly one text message in a scheduled brief - the brief itself - and nothing else: no line announcing that you are drafting, no draft file path, no tool output, no linter verdict. Every text fragment a run emits is delivered, and the send gate replaces the entire reply with a corruption notice when it sees an internal path or tool text, so one narration line costs the athlete the whole brief."
      - "The hr_zones array holds each zone's ceiling, not its floor - the last entry equals max_hr - so a heart rate takes the name of the first zone whose ceiling is at or above it: with ceilings 161, 170 and 180 named Recovery, Aerobic and Tempo, an average of 161 sits at the Recovery ceiling and the 162-170 band is Aerobic, so printing 161-170 as Tempo is one zone too hard."
      - "Before judging whether a completed session followed its plan, fetch the prescription itself: call get_planned_events with days_back at least as long as the recent-activities window, or match the activity's paired_event_id when it is set, and compare executed duration, distance, HR and load against that event's own planned values; a forward-only fetch cannot see the event that prescribed the session you are reviewing, so when no prescription is found say the adherence comparison is unavailable instead of treating the session as executed as planned."
      - "Never extend a calendar claim past the last date the events fetch actually returned: name the date the fetch reached and call the days beyond it unknown rather than empty, because days_ahead is the horizon that was asked for and not the end of the calendar."
      - "A prescription is bounded by the ceilings the same brief prints: once a brief has derived a ceiling - an endurance ceiling from eFTP, or a zone ceiling from hr_zones - the band it prescribes and any HR cap attached to that band must sit at or below the ceiling it just named, so a brief that states about 180 W as the endurance ceiling prescribes 155-180 W rather than 170-185 W, and an easy ride's HR cap is the Aerobic ceiling (the second hr_zones entry - 146 bpm in 131/146/153/163/167/172/181) rather than the SubThreshold ceiling at 163; if the band or cap you were about to write exceeds a ceiling you have just stated, lower the band, never the ceiling."
      - "A gap in the executed record is a horizon and an unknown, not a rest day: get_recent_activities(uid, 3) returns three days, so 'no real rides on record', 'nothing has been executed' and 'clearly detraining' are claims about that window only - name it, and before writing that no completed session exists to restart from, re-fetch with 7 to 14 days, because the last completed session outside a three-day window is still the session the next step is dosed from; when the gap is real, call its reason unknown rather than rest and hold the restart at that session's duration and load, because detraining is one to two weeks without load (plasma volume falls first - Convertino 1991) while an unexplained layoff may be pain or illness the brief cannot see."
      - "Count a day's load once per session, not once per upload, and test for it on a window wide enough to contain the pair: get_recent_activities returns a row for every file intervals.icu ingested and never returns external_id, so two rows sharing a date, type, duration, distance and average HR are one session uploaded twice and that tuple is the whole test, which the reconciliation in rule 18 cannot perform because duplicate rows sum to the day's ctl_load. A doubled row also inflates every wellness row after its date, not only its own: one extra copy of load L adds about L/7 to ATL and L/42 to CTL, so TSB reads about 0.12 x L too low on that date and then decays - which is why the artifact outlives the three-day activity fetch the brief's own procedure runs, and why a pair four days old can inflate today's TSB while staying invisible to it. Before printing a CTL, ATL, TSB or ramp rate, fetch at least seven days of activities; when a pair is inside that window, name it with the ids that fetch returned, quote the session's own load once, and never grade fatigue, a record week, a detraining state or a ramp rate, and never cut a session or lower a week's intensity, from a load the wellness row doubled."
      - "A duplicate upload is a data artifact, not fatigue, so the wellness figures it inflates cannot be reported as the athlete's state: when the duplicate of rule 26 is present, say in the same sentence that the platform's CTL, ATL and TSB for that date and every date after it are inflated by the second copy, quote the session's own load once, and never attach a risk label such as 'below -20' or 'risk level' to the inflated figure, and never cut the day's session or lower a prescribed week's intensity because of it. Decide the day from the athlete's own report and from the session loads counted once, and when the duplicate is still on the platform name the correction - one of the two rows has to be deleted in intervals.icu - instead of planning around the inflated number; an inflated TSB is a reason to ask how the athlete feels, never a reason to reduce the session before they have answered; the caveat is one clause on the number being printed, not a re-analysis of the session, so it stays even when the athlete already knows about the duplicate and the artifact is days old - guidance not to re-flag a known duplicate governs re-describing the session, never the sentence that qualifies an inflated figure."
      - "Check every number you print against the row it came from and the arithmetic it implies, because a value can be right on its own and false in the sentence: a percentage printed beside a watt band has to be computed from that band, so on an eFTP of 239 W the 55-75 % band is 131-179 W and a prescription of 155-180 W labelled 55-75 % is wrong at both ends - 155 W is 65 % of 239 W and 180 W sits above the 179 W ceiling the label implies; a band you recognise from these rules or from an earlier brief is not a derivation, so derive the band from the percentage and the percentage from the band instead of reusing a familiar pair; and a field that is null in the newest wellness row is missing, not carried forward - name the date of the row the value was actually recorded on, because the 2026-11-10 brief wrote that the last measurement was 2026-11-09 with HRV SDNN 29.4 while that row's hrv_sdnn was null and 29.4 was the 2026-11-08 value; and a claim that spans more than one row is assembled row by row, never from the impression the window gave, because every figure can be true and the set still false: a session's duration, distance, load and average heart rate all come from the single row that carries its date, so a brief that wrote one session as 51 min over 7.38 km at 151 bpm and RPE 4 was reading two - 51 min belongs to the 2026-11-09 run and 7.38 km with 151 bpm and RPE 4 to the 2026-11-11 one - and a duration that appears in no row describes a session that was never ridden; a count over a window is the same test, so 'under -20 in three of the last four days' is a claim about four dated rows and is counted from them rather than inferred from the trend - those rows read -21.1, -15.9, -25.1 and -19.1, which is two - and no risk label, no plan change and no ceiling may rest on a count you did not count."
      - "A session's exercise list is a claim about what the athlete will do, so test it against the purpose the same session states and against the day it sits on: name today's movements from the planned event's own description, and when that description promises a fresh-legged athlete for the next day's key session, a leg-dominant movement - lunge, split squat, squat, hip thrust - contradicts the promise however light the load, because eccentric-dominant single-leg work produces its soreness 24 to 48 hours later (Proske and Morgan 2001), which is the morning of that key session; on 2026-11-13 the entry was named for a light strength day and its description promised fresh legs for the following Saturday's long run in the same sentence that listed reverse lunges and hip thrusts, and the 04:20 brief reprinted the promise and the movement list in one paragraph, so the athlete had to ask why her upper-body day contained leg exercises before the entry was rewritten. When the calendar's movements conflict with the session's own purpose, say so in the brief and prescribe the set that honours it - upper body and trunk on the day before a long run - instead of repeating the contradiction, and hold the same check before writing the event."
    rebuild_dosing_evidence: "HR at a fixed submaximal load is the first marker to move after inactivity and the last to normalise (Coyle et al. 1984; Mujika & Padilla 2000), so a pre-layoff wattage is not a safe ceiling for early return sessions; see detraining_layoff_rebuild.dosing."
    progression_evidence: "Progressive overload is applied to completed work (Ronnestad et al. 2012 on session completion and load progression), so a skipped step leaves the athlete at the last achieved duration; the 2026-10-23 brief stepped from a completed 62 min (2026-10-19) to 75 min, a 21% jump above the documented 10% weekly ceiling, after three unlogged days."
    evidence_basis: "Autonomic and sleep markers are context-sensitive and should be interpreted with subjective effort and symptoms rather than as standalone readiness tests (Halson, 2014; Buchheit, 2014)."
    coverage_evidence: "A planning window with no forward entries is a planning state, not a training state: on 2026-10-25 all three audited athletes had nothing planned after that day (one plan held one rest NOTE for 2026-10-25 and nothing through 2026-11-02; a second held no entry at all in eight days; a third held the same apart from that day's rest note) and the 06:31 brief reported a rest day and stopped, because the corpus had no rule about the forward window and planned events are a brief's only plan input."
    zone_band_evidence: "An intensity descriptor is a claim about the athlete's own zone model, so it has to be derived from it: on 2026-10-26 the athlete's brief offered a normal aerobic session at HR 170-180 while her settings run Recovery to 161, Aerobic to 170 and Tempo to 180 with LTHR 191, so the band it called aerobic was Tempo, offered two days after a long run that averaged 175 against a 160 ceiling; the same athlete's 2026-10-25 weekly plan re-issued 65-70 min and about 12 km for a long run whose 60 min / 9 km cap had been broken four days earlier at 68.2 min, 12.01 km and avg HR 175. Bands named against the athlete's own boundaries and a cap held after a breach are the difference between an easy day and a threshold day mislabelled as one (Seiler 2010 on intensity distribution; Esteve-Lanao et al. 2007 on the cost of easy days run too hard)."
    window_bounded_claims_evidence: "A coaching statement is only as wide as the fetch behind it: on 2026-10-29 both briefs read a two-day event window ending 2026-10-31, and the athlete's brief reported 'nothing is planned from 2026-11-01 to 2026-11-07 - that is a planning gap' while an entry existed on 2026-11-01 that the fetch never returned; on the same morning a second athlete's run went out at 52.5 min, 8.38 km and load 72 against event 148334313, which prescribed 30-35 min, HR under 155 and load 18, and paired_event_id is null on every completed activity of both athletes, so days_back is the only route back to the prescription a brief is meant to review. Naming the window that was actually read is the difference between a bounded observation and an invented one."
    threshold_anchor_evidence: "A configured threshold is a modelled parameter while the executed record is a measurement, and when they disagree the measured one governs the prescription: on 2026-10-28 the athlete's settings carried threshold_pace_mps 3.4482758 (4:50/km) while her fastest run of the last 30 days was 12.01 km in 68.2 min (5:41/km) at avg HR 175, 91.6% of LTHR 191 - a pace 17% faster than she has ever held for an hour, and the same settings file labels that 5:41 effort Zone 2 on pace while HR places it in Tempo; the morning brief then repeated 4:50 as her threshold with no source. Threshold is the ~60 min maximal steady state (Allen and Coggan, Training and Racing with a Power Meter; Daniels' T pace), so a modelled value has to be validated by a sustained effort before bands are derived from it. The same holds for heart rate, and there the failure is quieter because the athlete is the only instrument that can falsify it: on 2026-11-12 a threshold session was prescribed at 185-195 bpm and described to the athlete as 94-100% of an LTHR of 191, while her highest heart rate over eight continuous minutes that month was 176 bpm and her best hour of the month averaged 175 - so the band's top sat above the LTHR it claimed to be a percentage of (94-100% of 191 is 180-191), above the max 180 she reached in that very session, and above anything she had produced for weeks; she stopped after two intervals reporting that she had gone as hard as she could without reaching 185, and the coach conceded the target was an estimate rather than a measurement and lowered it to 175-185, whose top no heart rate of hers had ever reached either. LTHR is a measured quantity: Friel's 30-minute time trial takes the last 20 minutes' average and a 20-minute test is corrected by about 5%, and cardiac drift under heat, dehydration, caffeine, sleep loss and accumulated fatigue moves the real value against the athlete exactly when the session matters (Friel, The Triathlete's Training Bible; Allen and Coggan on threshold as a state rather than a fixed number), so a bpm band derived from an unvalidated LTHR is a target the athlete can only verify by failing it."
    load_provenance_evidence: "A wellness record stops being a measurement once a session is on the calendar: on 2026-10-31 the athlete's today record carried ctl_load 58, exactly event 148926436's planned_load, with projected_ctl 24.19 and projected_atl 15.09 against wellness ctl 24.2 and atl 15.1, while his last completed ride was 2026-10-29 and 2026-10-30 carried ctl_load 0.0 - and the 06:31 brief still reported ATL rising 8.5 to 15.1 after Friday's Zwift work, inventing a session on a rest day and feeding it to the assessment that gates his knee return. One day later the same load had become a past date: on 2026-11-01 the 2026-10-31 wellness row still carried ctl_load 58 - event 148926436's planned_load again - and atl_load 65, while the only activity logged that date was a 13-minute walk with load 7, and the 07:31 brief reported TSB 9.7 (ATL 13.9, CTL 23.6) as 'trending mildly up since 2026-10-29' without noting that the day it rose on had no ride, so a skipped session kept standing in as training."
    delivery_discipline_evidence: "A brief is only as good as the text that leaves the session: on 2026-10-30 a brief was drafted and passed the linter clean, then never arrived - the same run had also emitted a line naming the internal draft file and the linter's own verdict, so the send gate replaced the whole reply with the corruption notice while the 1478 bytes already written were correct and complete. The same morning a second athlete's brief called the 161-170 band Tempo, although that athlete's own settings put the Aerobic ceiling at 170 and the previous brief had called 161 the lower edge of Aerobic, so one boundary carried two different names in two consecutive briefs. Emitting only the brief, and reading a zone name off the ceiling entry rather than the floor, are what let a clean draft reach the athlete correctly labelled."
    zone_units_evidence: "The zone arrays are stored in the threshold's units, not the athlete's: the two briefs of 2026-10-31 placed the same 145-170 W band in an Endurance zone of 135-199 W at 06:31 and in an Endurance zone with ceiling 180 W at 07:31, while power_zones 55/75/90/105/120/150/999 against FTP 265 put Endurance at 146-199 W and 180 W is only the event's own cap - two bound sets for one band in one morning, neither of them the array's."
    prescription_bounds_evidence: "A brief can contradict a ceiling its own paragraph derived, and the athlete reads the prescription rather than the derivation: on 2026-11-02 a brief printed that eFTP 241 puts the endurance upper bound at 181 W and 'treat ~180 W as the endurance ceiling reference', then offered '1 h indoor ride (Zwift) at 170-185 W, HR kept under 163 (your Aerobic/Tempo boundary)' - a band whose top sits above its own ceiling, an HR cap on the SubThreshold boundary rather than the Aerobic ceiling of 146, and a step up from the last completed ride (2026-10-29, 50.8 min, NP 155 W) four days earlier, from the same settings payload that carried both numbers. The same morning another athlete's brief called a 143 bpm average 'Aerobic-zon' when 143 sits below that athlete's 161 bpm Recovery ceiling."
    activity_horizon_evidence: "An absence claim is only as wide as the fetch behind it, and the activity fetch is a window like the calendar one: on 2026-11-03 the athlete's brief read get_recent_activities(uid, 3) - two 'Timed Activity' rows of 8.2 and 13.3 minutes - and wrote 'no real rides on record, so the falling CTL reflects days not trained', then 'restart from the last real completed ride - none recent', prescribing 60-75 min at 155-180 W, while a 10-day fetch shows the 2026-10-29 Zwift ride (50.8 min, NP 155 W, load 29) and the 2026-10-27 road ride (45.4 min, load 29) inside five days, and the interactive coach had capped his knee return at 45-60 min two days earlier. The same overreach on 2026-10-25 called a three-day CTL drift (26.7 to 24.9) 'a clear detraining drift - fitness is being lost', a claim about physiology that needs one to two weeks without load (Coyle et al. 1984; Mujika and Padilla 2000; Convertino 1991 on plasma volume)."
    sync_gap_evidence: "A wellness row for yesterday is a snapshot of the last upload, not the day's training, and the row itself changes under the brief: on 2026-11-06 the athlete's 04:21 get_wellness(uid, 3) returned the 2026-11-05 row at ctl 32.0 / atl 37.0 / tsb -5.0 with ctl_load 15.0, while the same run's three-day activity fetch held no activity on that date - so the brief named her 2026-11-04 run as the last completed session and closed by calling the objective trend reassuring because TSB was rising and ATL falling. By 11:00 the same row read ctl 32.8 / atl 42.0 / tsb -9.2 with ctl_load 53.0, matching a 37.0 min, 6.02 km run at avg HR 153 and RPE 4 that had synced after the brief: ATL had risen, not fallen, and the paragraph's direction claim was false in the delivered text. The 15.0 was a booking, the load a planned event had already put on the day, and the rule as it stood would have licensed the brief to call that day 'not trained'. The same race cost the 2026-11-04 brief the 2026-11-03 walk and Pilates session (the 2026-11-03 row's ctl_load moved from 0.0 to 15.0 when they synced) and a second athlete's 2026-11-03 brief two real rides. An unloaded day and an unsynced day are indistinguishable in the payload until the newest activity date is compared with the date being described."
    duplicate_upload_evidence: "An upload is not a session, and the doubled day looks reconciled: on 2026-11-08 at 06:45:50 and again at 06:46:32 intervals.icu ingested the same Apple Watch file twice - i207240995 then i207241236, one external_id, both 82.4 min, 13.01 km, avg HR 158, load 111 - and the 2026-11-07 wellness row then carried ctl_load 225.0 with atl 64.0765, ctl 36.6158 and tsb -27.5 for a day whose own load is 114 (111 run plus 3 walk). The 04:21 brief saw neither upload, because the file was created 2 h 24 min after it finished, so it reported TSB +3.2 and called the load releasing from a decay curve; the next brief and the 19:00 weekly plan see only 225 and a TSB near -20, and that plan's own rule lowers intensity below TSB -15. Rule 18's reconciliation passes anyway, because the two duplicate rows sum exactly to the row's ctl_load, so a double count is invisible to a load-matching check and visible only in the activity list."
    duplicate_load_handling_evidence: "Detecting the duplicate is not the same as refusing to use it: on 2026-11-09 the athlete's 04:21 brief did name the double upload, then reported today's TSB as minus 20,3 and called that level a risk, and offered a cut-back threshold (2x6 min, or 35-40 min easy) on a figure the duplicate had inflated, while the 2026-11-07 row still read ctl_load 225.0 with atl 64.1 and tsb -27.5 against 114 of real load. Under the platform's own 7-day and 42-day constants the duplicate's 111 load contributes about 11.7 to ATL and 2.5 to CTL two days later, so the deduplicated picture is roughly ATL 46 and TSB -12: not a risk level, and no reason to shorten the session. The 2026-11-08 19:05 weekly plan made the same error one level up, capping the long run at 65 min with a hard HR cap because a ramp rate of 2,64 and a TSB of -27,5 said volume up, intensity down - both numbers computed from the doubled row - so the artifact changed a written week as well as a morning recommendation. Both rows were still on the platform at 11:00 on 2026-11-09, so every brief and every weekly plan will keep reading the inflated figure until one is deleted."

    printed_value_evidence: "A number's authority is the row it came from and its own arithmetic, and both fail silently: on 2026-11-10 the 07:30 brief offered '~90 min indoor, 155-180 W (55-75% of eFTP 239 = Endurance)', where the band is 65-75 % of 239 W, the 55-75 % band is 131-179 W, and the top sits above the ceiling the label implies - and 155-180 W is the example band printed verbatim in gate rule 24 and in the 2026-11-03 brief, so the prescription was recalled from the corpus rather than derived from the athlete's eFTP. The same morning the 04:21 brief wrote that the last measurement was 2026-11-09 with HRV SDNN 29.4, while the 2026-11-09 wellness row's hrv_sdnn was null when the brief read it and 29.4 was the 2026-11-08 value, which by 11:00 had been replaced by 52.28 for 2026-11-09 - a missing field re-dated to the newest date reads to the athlete as a fresh measurement. Percentages of FTP or eFTP are the athlete's zone model in percent form (Coggan), so a mislabelled band misstates the intensity the session is prescribed at, and a nightly marker belongs to the night it was recorded. On 2026-11-12 the 04:20 brief described the previous day's session as 51 min over 7.38 km at 151 bpm average and RPE 4, which fuses two rows - 51 min is the 2026-11-09 run, while 7.38 km, 151 bpm and RPE 4 are the 2026-11-11 run - and in the same paragraph counted TSB 'under -20 in three of the last four days' from rows reading -21.1, -15.9, -25.1 and -19.1, which is two. The inflated count then carried a load-risk label and a hard HR cap onto the athlete's next long run, so a figure that matches no row and a count that was never counted fail exactly as a miscomputed percentage does: the sentence is the claim and the row is its authority."

    session_purpose_evidence: "A prescription's movements are judged against the purpose the same prescription states, and the brief that repeats both is the last checkpoint before the athlete acts on them: on 2026-11-13 calendar entry 154875654, written the previous day for a light strength session, was named for a light strength day and described as leaving the legs fresh for the 2026-11-14 long run, while its movement list carried reverse lunges and hip thrusts - the two most leg-dominant items on it. The 04:20 brief's IDAG paragraph reprinted the entry almost verbatim, so the delivered text promised fresh legs and prescribed leg work in consecutive sentences, and the athlete asked why her upper-body day contained leg exercises before the coach deleted the entry and rewrote it as upper body and trunk (event 155249222). The session it protected was a 65 min / 10 km long run capped at a 155 bpm average, the only key session in that week, so the contradiction sat one day and one paragraph away from the session it was meant to serve."

  consecutive_hard_days:
    max_before_recovery: 2
    note: >
      Stacking 3+ high-intensity days without an easy day significantly increases
      injury risk and reduces quality of subsequent sessions.
      The second hard day is almost always lower quality than the first.

  recovery_week_frequency:
    general: "Every 3rd or 4th week"
    masters_50_plus: "Every 2nd or 3rd week"
    volume_reduction: "30–40% reduction from peak week"
    intensity: "Reduce intensity AND volume during recovery weeks"

# Fatigue Management
fatigue_management:
  overtraining_syndrome_warning_signs:
    signs:
      - "Performance decline despite maintained or increased training"
      - "Persistent HRV suppression > 2 weeks"
      - "Elevated resting HR > 5 bpm above normal"
      - "Mood disturbances: irritability, depression, lack of motivation"
      - "Sleep disturbances despite fatigue"
      - "Increased illness frequency"
      - "Muscle soreness that does not resolve with rest"
    action: >
      If 3+ signs present: recommend 1–2 weeks complete rest, followed by
      gradual return. Consider referral to sports medicine physician if
      symptoms persist beyond 2 weeks of rest.

  non_functional_overreaching:
    description: >
      Performance decline that takes weeks to months to recover from.
      Distinct from functional overreaching (days to 1 week recovery).
    prevention:
      - "Never increase weekly load > 10% from previous week"
      - "Enforce recovery weeks every 3–4 weeks"
      - "Monitor TSB — do not sustain TSB < -20 for more than 2 weeks"
      - "Treat illness and injury as mandatory rest"
