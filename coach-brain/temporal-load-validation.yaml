temporal_load_validation:
  purpose: >
    Prevent historical training load, stale wellness records, or mismatched
    comparison windows from being presented as current fatigue or readiness.
  clock_discipline:
    purpose: >
      Resolve the current instant before any day-relative statement. A session's
      earlier turns are not a clock: yesterday-evening wording carried into this
      morning silently rewrites today, tonight and tomorrow.
    rules:
      - "Establish the current date, ISO weekday and local time in the athlete's timezone from a fresh source at the start of every response; never reuse the day, time or implied 'today' of an earlier turn in the same session."
      - "Relative words — today, tonight, tomorrow, this morning, yesterday — resolve only against that freshly checked instant; wording written last evening makes 'tonight' and 'tomorrow' false now."
      - "When the athlete contradicts the draft's day or time (\"today is Monday\"), re-derive from the clock and correct the prescription itself, not just the label; never restate the stale frame."
      - "Name the ISO date and weekday in any prescription for a specific day, so a stale frame shows up in the draft instead of in the athlete's correction."
      - "Measure rest or gap length from the fresh clock against the last verified activity date, never from the previous reply's relative wording."
    source_notes: >
      Recurred five times Jul–Oct 2026, each time corrected by the athlete:
      msg 4547 (20260718_082523_f5701307), msg 9764 (20260805_152606_0076885a,
      'Fel dag igen'), msg 10996 (20260812_041635_ac38f528), msg 22704
      (20260831_043233_5e644b44), and msgs 22802–22807 (20260901_084628_a93bbd82:
      on Monday 08:17 CEST the bot opened with it being 18:10 and prescribed
      45 min instead of the 60 min due, then needed the athlete's correction
      plus a terminal date call to recover).
  timeline_workflow:
    - "Anchor every assessment to an explicit as-of date and timezone."
    - "Separate today's record, the recent 7–14 day load, and the longer baseline; do not substitute one window for another."
    - "Before attributing symptoms to overload, verify the dates, sport, duration, and actual completed activities in the relevant window."
    - "For every human-readable weekday paired with a date, derive the weekday from that exact ISO date in the athlete's configured timezone; never infer it from the response day or memory."
    - "Check each dated label after drafting, including historical activity dates, wellness dates, planned-event dates, and relative phrases rewritten as dates."
    - "When summarizing the latest available record, use that record's actual ISO date and derive its weekday; never infer a weekday from its position in the returned list, the current brief date, or words such as latest/previous."
    - "If a date and weekday disagree, remove the weekday or correct it before delivery; do not let otherwise-correct numbers create false confidence."
    - "Compare the planned session with what was completed, including missed, shortened, or non-sport activities."
    - "Before prescribing today's planned session, reconcile all completed activities through the latest verified date; if an equivalent session was already completed, do not repeat it—defer, replace, or mark the plan complete."
  evidence_rules:
    - "Use current wellness and recent activities for today's decision; use 28–42 day data to establish trend, not to label today's fatigue."
    - "Treat CTL, ATL, and TSB as model outputs whose meaning depends on the selected date and load history."
    - "Recompute simple derived labels from the source fields before delivery (for example, TSB sign and arithmetic from CTL/ATL); correct drafts that contradict the verified values."
    - "When athlete recollection conflicts with a summary, acknowledge the discrepancy, inspect the underlying activities, and state which evidence is uncertain."
    - "Never fill a missing current value with an older value or describe an old hard session as recent."
  coaching_response:
    - "State measured facts first, with dates and the comparison window."
    - "Then state the inference and its confidence; do not claim causation from load alone."
    - "If the timeline is unclear, choose a conservative conditional session and ask one focused clarification rather than escalating training."
    - "Reassess after the correct window is verified, especially when persistent decline or breathlessness is reported."
  safety: >
    Persistent symptoms, unusual breathlessness, chest pain, fainting, neurological
    symptoms, or decline unexplained by the verified training timeline require
    appropriate medical referral rather than a load-based training explanation.
  evidence_basis: >
    Training-load metrics are exponentially weighted estimates and are sensitive
    to the observation window; sound monitoring combines internal load, external
    load, symptoms, and context rather than relying on a single aggregate metric
    (Bourdon et al., 2017; Halson, 2014).
  see_also:
    - coach-brain/goal-continuity-adaptive-planning.yaml
    - coach-brain/persistent-performance-decline.yaml
    - coach-brain/recovery-heuristics.yaml
    - coach-brain/post-workout-feedback.yaml
